<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Registro de pagos</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <section id="login" class="tarjeta login" hidden>
    <h1>Ingresar</h1>
    <p>Acceso solo para el equipo.</p>
    <form id="form-login">
      <label>Correo
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Entrar</button>
      <p id="mensaje-login" class="mensaje" role="status"></p>
    </form>
  </section>

  <main id="app" hidden>
    <section class="tarjeta" aria-labelledby="t-listado">
      <h1 id="t-listado">Listado de personas y montos</h1>
      <div class="tabla-envoltura">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th class="col-correo">Correo</th>
              <th class="num">Monto</th>
              <th>Recibo</th>
            </tr>
          </thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
      <p id="vacio" class="vacio" hidden>Aún no hay pagos registrados.</p>
    </section>

    <section class="tarjeta" aria-labelledby="t-registro">
      <h2 id="t-registro">Registrar nuevo pago</h2>
      <form id="formulario" novalidate>
        <label>Nombre
          <input name="nombre" autocomplete="off" required maxlength="120">
        </label>
        <label>Correo
          <input name="correo" type="email" autocomplete="off" required maxlength="200">
        </label>
        <label>Monto (USD)
          <input name="monto" inputmode="decimal" placeholder="0.00" required>
        </label>
        <button type="submit">Registrar pago</button>
        <p id="mensaje" class="mensaje" role="status"></p>
      </form>
    </section>

    <p class="pie"><button type="button" id="salir" class="enlace">Cerrar sesión</button></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
